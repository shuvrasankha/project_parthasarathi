[project]
name = "krishna-guide-rag"
version = "0.1.0"
description = "Retrieval layer for Krishna Guide: Gita verses, Ganguli Mahabharata, curated situations."
requires-python = ">=3.11,<3.13"
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "indic-transliteration>=2.3.82",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
