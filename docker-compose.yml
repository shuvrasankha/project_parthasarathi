services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: krishna
      POSTGRES_PASSWORD: krishna
      POSTGRES_DB: krishna
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishna -d krishna"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
